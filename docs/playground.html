<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateDreamer Playground</title>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }
        button:hover { background: #f5f5f5; }
        .theme-picker { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DateDreamer Playground</h1>
        
        <div class="theme-picker">
            <button onclick="setTheme('default')">Default (Purple)</button>
            <button onclick="setTheme('forest')">Forest (Green)</button>
            <button onclick="setTheme('ocean')">Ocean (Blue)</button>
            <button onclick="setTheme('sunset')">Sunset (Orange)</button>
        </div>

        <date-dreamer-calendar id="calendar"></date-dreamer-calendar>

        <div class="controls">
            <button onclick="document.getElementById('calendar').setAttribute('dark-mode', '')">Toggle Dark Mode</button>
        </div>
    </div>

    <script>
        // Mock implementation of the component for playground demo purposes
        // In real life, you'd import the actual bundle
        class MockCalendar extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                    <style>
                        :host { --dd-primary: #7d56da; display: block; }
                        .calendar { 
                            padding: 20px; border: 1px solid #ddd; border-radius: var(--dd-radius-md, 8px);
                            background: var(--dd-bg, white); color: var(--dd-text, black);
                            width: 250px; text-align: center;
                        }
                        .btn { background: var(--dd-primary); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
                    </style>
                    <div class="calendar">
                        <div style="margin-bottom: 10px; font-weight: bold;">June 2026</div>
                        <div class="days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;">
                            ${Array.from({length: 30}, (_, i) => `<div style="padding: 5px; border-radius: 4px; cursor: pointer; background: #eee;">${i+1}</div>`).join('')}
                        </div>
                        <p>Click to interact</p>
                        <button class="btn">Next Month</button>
                    </div>
                `;
            }
        }
        customElements.define('date-dreamer-calendar', MockCalendar);

        function setTheme(theme) {
            const cal = document.getElementById('calendar');
            if (theme === 'forest') {
                cal.style.setProperty('--dd-primary', '#2ecc71');
            } else if (theme === 'ocean') {
                cal.style.setProperty('--dd-primary', '#3498db');
            } else if (theme === 'sunset') {
                cal.style.setProperty('--dd-primary', '#e67e22');
            } else {
                cal.style.setProperty('--dd-primary', '#7d56da');
            }
        }
    </script>
</body>
</html>
